# Push a main → tests → imagen en ghcr → etiqueta nueva en k8s/kustomization.yaml → Argo CD despliega.
# El bump lo hace GITHUB_TOKEN (no dispara workflows) y además lleva [skip ci]. k8s/ no dispara: los
# manifiestos los aplica Argo sin imagen nueva, así volver atrás (un sha-<7> viejo en newTag) no se pisa.
name: deploy

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md', 'k8s/**']
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: deploy-${{ github.repository }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/javierarbelaiz/videorepo

jobs:
  deploy:
    # workflow_dispatch desde otra rama no puede llevar esa rama a main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # El token de escritura no queda en .git/config mientras corren deps y tests.
          persist-credentials: false

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: '1.17'
          otp-version: '27'

      - name: Tests
        # La app crea sus carpetas al arrancar; en el runner no se puede escribir en /data.
        env:
          VIDEO_DIR: ${{ runner.temp }}/videos
          TMPDIR: ${{ runner.temp }}/uploads
          TLS_DIR: ${{ runner.temp }}/certs
          TOOLS_DIR: ${{ runner.temp }}/tools
        run: |
          mkdir -p "$VIDEO_DIR" "$TMPDIR" "$TLS_DIR" "$TOOLS_DIR"
          mix local.hex --force && mix local.rebar --force
          mix deps.get
          mix test

      - name: Etiqueta
        id: tag
        run: echo "sha7=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:sha-${{ steps.tag.outputs.sha7 }}
            ${{ env.IMAGE }}:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Actualizar la etiqueta que sigue Argo CD
        env:
          SHA7: ${{ steps.tag.outputs.sha7 }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          # Sin rebase: si main avanzó se toma main tal cual y se vuelve a poner la etiqueta.
          for intento in 1 2 3; do
            git fetch -q origin main
            git reset --hard origin/main >/dev/null
            sed -i "s/newTag: .*/newTag: sha-${SHA7}/" k8s/kustomization.yaml
            if git diff --quiet; then echo "la etiqueta ya estaba al día"; exit 0; fi
            git commit -qam "chore: imagen sha-${SHA7} [skip ci]"
            if git push -q origin HEAD:main; then exit 0; fi
            echo "main avanzó, reintento ${intento}"
          done
          echo "no se pudo actualizar la etiqueta" >&2
          exit 1
