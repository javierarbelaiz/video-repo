# Deployment alternativo: corre la app desde el fuente (ConfigMap) en la imagen
# PUBLICA elixir:1.17-slim (Docker Hub) -> no necesita ghcr privado ni pull-secret.
# El fuente se monta desde el ConfigMap "videorepo-src".
apiVersion: apps/v1
kind: Deployment
metadata:
  name: videorepo
  namespace: videorepo
  labels: { app: videorepo }
spec:
  replicas: 1
  selector:
    matchLabels: { app: videorepo }
  strategy:
    type: Recreate
  template:
    metadata:
      labels: { app: videorepo }
    spec:
      containers:
        - name: videorepo
          image: elixir:1.17-slim
          imagePullPolicy: IfNotPresent
          workingDir: /app
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              mkdir -p "$TMPDIR" "$VIDEO_DIR"
              echo "[boot] instalando ca-certificates (la imagen slim no los trae)"
              export DEBIAN_FRONTEND=noninteractive
              for i in 1 2 3; do apt-get update && break; sleep 3; done
              apt-get install -y --no-install-recommends ca-certificates curl xz-utils openssl unzip
              echo "[boot] herramientas (ffmpeg + yt-dlp + deno) en el PVC"
              mkdir -p "$TOOLS_DIR"
              # ffmpeg SI se congela: no habla con nadie que cambie las reglas y
              # una version estable evita sorpresas de transcodificacion.
              if [ ! -x "$TOOLS_DIR/ffmpeg" ]; then
                curl -fsSL https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz -o /tmp/ff.tar.xz \
                  && mkdir -p /tmp/ffx && tar -xf /tmp/ff.tar.xz -C /tmp/ffx --strip-components=1 \
                  && cp /tmp/ffx/ffmpeg /tmp/ffx/ffprobe "$TOOLS_DIR/" && rm -rf /tmp/ff.tar.xz /tmp/ffx \
                  || echo "[boot] WARN: fallo la descarga de ffmpeg"
              fi
              # yt-dlp NO se congela. Vive en el PVC, o sea que sobrevive a todos
              # los reinicios: con un "if [ ! -x ]" se quedaba con la version del
              # primer arranque para siempre. YouTube rota sus defensas cada pocas
              # semanas y a partir de ahi cada descarga muere con HTTP 403.
              # Se baja en CADA arranque, sobre un archivo aparte, y solo se pisa
              # el bueno si la descarga entera salio bien: sin red nos quedamos con
              # el que ya estaba en lugar de dejar el PVC con medio binario.
              if curl -fsSL https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux -o "$TOOLS_DIR/yt-dlp.new"; then
                mv "$TOOLS_DIR/yt-dlp.new" "$TOOLS_DIR/yt-dlp" && chmod +x "$TOOLS_DIR/yt-dlp"
                echo "[boot] yt-dlp $("$TOOLS_DIR/yt-dlp" --version 2>/dev/null)"
              else
                rm -f "$TOOLS_DIR/yt-dlp.new"
                echo "[boot] WARN: no pude actualizar yt-dlp, sigo con $("$TOOLS_DIR/yt-dlp" --version 2>/dev/null || echo ninguno)"
              fi
              # deno resuelve los desafios JS de YouTube ([jsc:deno] en el log de
              # yt-dlp). Estaba SOLO en el PVC, puesto a mano en un incidente
              # anterior: si el PVC se recreaba se perdia sin que nadie se entere.
              if [ ! -x "$TOOLS_DIR/deno" ]; then
                curl -fsSL https://github.com/denoland/deno/releases/latest/download/deno-x86_64-unknown-linux-gnu.zip -o /tmp/deno.zip \
                  && unzip -oq /tmp/deno.zip -d "$TOOLS_DIR" && rm -f /tmp/deno.zip \
                  || echo "[boot] WARN: fallo la descarga de deno (yt-dlp puede fallar con desafios JS)"
              fi
              chmod +x "$TOOLS_DIR"/* 2>/dev/null || true
              export PATH="$TOOLS_DIR:$PATH"
              echo "[boot] certificado TLS autofirmado (WebXR exige contexto seguro)"
              mkdir -p "$TLS_DIR"
              if [ ! -f "$TLS_DIR/cert.pem" ] || [ ! -f "$TLS_DIR/key.pem" ]; then
                openssl req -x509 -newkey rsa:2048 -nodes -days 3650 \
                  -keyout "$TLS_DIR/key.pem" -out "$TLS_DIR/cert.pem" \
                  -subj "/CN=$TLS_HOST" \
                  -addext "subjectAltName=IP:$TLS_HOST,DNS:videorepo.local" \
                  && echo "[boot] cert generado para $TLS_HOST" \
                  || echo "[boot] WARN: fallo la generacion del cert, arranco solo HTTP"
              fi
              echo "[boot] copiando fuente a /app"
              mkdir -p /app
              cp -rL /src/mix.exs /src/config /src/lib /src/priv /app/
              [ -f /src/mix.lock ] && cp -L /src/mix.lock /app/ || true
              cd /app
              export HOME=/app MIX_ENV=prod
              mix local.hex --force
              mix local.rebar --force
              echo "[boot] mix deps.get"
              mix deps.get
              echo "[boot] compilando y arrancando"
              exec mix run --no-halt
          env:
            - { name: VIDEO_DIR, value: /data/videos }
            - { name: TMPDIR, value: /data/videos/.uploads }
            - { name: TOOLS_DIR, value: /data/videos/.tools }
            - { name: PORT, value: "4000" }
            - { name: LANG, value: C.UTF-8 }
            - { name: TLS_PORT, value: "4443" }
            - { name: TLS_DIR, value: /data/videos/.certs }
            - { name: TLS_HOST, value: "192.168.1.199" }
          ports:
            - containerPort: 4000
            - containerPort: 4443
          volumeMounts:
            - { name: src, mountPath: /src, readOnly: true }
            - { name: app, mountPath: /app }
            - { name: videos, mountPath: /data/videos }
          startupProbe:                     # da tiempo a bajar deps + compilar
            httpGet: { path: /health, port: 4000 }
            periodSeconds: 5
            failureThreshold: 120           # ~10 min de margen
          livenessProbe:
            httpGet: { path: /health, port: 4000 }
            periodSeconds: 20
      volumes:
        - name: src
          hostPath:
            path: /home/thehook/video-repo   # el repo clonado en el nodo (git pull + rollout restart para actualizar)
            type: Directory
        - name: app
          emptyDir: {}
        - name: videos
          persistentVolumeClaim:
            claimName: videos
