<!doctype html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video Repo · 360</title>
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,Segoe UI,Roboto,sans-serif;background:#0e1116;color:#e6edf3}
  header{padding:20px 24px;border-bottom:1px solid #21262d}
  header h1{font-size:20px;margin:0}
  .wrap{max-width:900px;margin:0 auto;padding:24px}
  ul{list-style:none;padding:0;margin:0}
  li{margin-bottom:8px}
  button.pick{width:100%;text-align:left;display:flex;gap:12px;align-items:center;
    background:#161b22;color:#e6edf3;border:1px solid #30363d;border-radius:10px;
    padding:14px 16px;font-size:16px;cursor:pointer}
  button.pick:hover{background:#21262d;border-color:#2f81f7}
  button.pick .s{margin-left:auto;color:#8b949e;font-size:13px}
  #msg{padding:14px 16px;border-radius:10px;margin-bottom:16px;display:none;font-size:14px}
  #msg.err{display:block;background:#2d1418;border:1px solid #6e2630;color:#ffb4bb}
  #msg.info{display:block;background:#111a2b;border:1px solid #1f3a5f;color:#cdd9e5}
  #stage{display:none}
  #stage.on{display:block}
  video{width:100%;max-height:40vh;background:#000;border-radius:10px}
  .row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  .btn{background:#238636;color:#fff;border:1px solid #2ea043;border-radius:8px;
    padding:12px 20px;font-size:16px;cursor:pointer}
  .btn.sec{background:#21262d;border-color:#30363d;color:#e6edf3}
  .btn[disabled]{opacity:.5;cursor:not-allowed}
  code{background:#161b22;border:1px solid #21262d;border-radius:6px;padding:2px 6px;font-size:13px}
</style>
</head><body>
<header><h1>🌐 Video 360</h1></header>
<div class="wrap">
  <div id="msg"></div>
  <ul id="list"></ul>

  <div id="stage">
    <video id="video" playsinline crossorigin="anonymous"></video>
    <div class="row">
      <button class="btn" id="enter">Entrar en VR</button>
      <button class="btn sec" id="back">Volver a la lista</button>
    </div>
  </div>
</div>
<script src="/vr/three.min.js"></script>
<script src="/vr/app.js"></script>
</body></html>
