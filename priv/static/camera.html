<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cámara · VideoRepo</title>
<style>body{font:1rem system-ui;background:#0e1116;color:#eee;max-width:54rem;margin:auto;padding:1.2rem}a{color:#8ac6ff}img,video{display:block;width:100%;max-width:640px;background:#161b22}li{margin:.6rem 0}</style>
<a href="/">← VideoRepo</a><h1>Cámara</h1><img id="live" alt="Imagen actual de la cámara"><p id="state" role="status"></p>
<h2>Grabaciones por movimiento</h2><ul id="clips"></ul>
<script>
const live=document.querySelector('#live'), state=document.querySelector('#state'), clips=document.querySelector('#clips');
function refresh(){if(!document.hidden)live.src='/camara/imagen?t='+Date.now()}
live.onload=()=>{state.textContent='Actualizada a las '+new Date().toLocaleTimeString();setTimeout(refresh,1000)};
live.onerror=()=>{state.textContent='Cámara sin señal. Reintentando…';setTimeout(refresh,5000)};
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});refresh();
async function list(){try{
  const r=await fetch('/api/videos',{cache:'no-store'});if(!r.ok)throw Error();
  const files=(await r.json()).filter(v=>v.name.startsWith('CamNet_record_')).sort((a,b)=>b.name.localeCompare(a.name));
  clips.replaceChildren(...files.map(v=>{const li=document.createElement('li'),a=document.createElement('a');a.href='/videos/'+encodeURIComponent(v.name);a.textContent=v.name.replace('CamNet_record_','');li.append(a);return li}));
  if(!files.length)clips.textContent='Todavía no hay clips.';
}catch{clips.textContent='No se pudo cargar la lista.'}}
list();setInterval(list,30000);
</script></html>
