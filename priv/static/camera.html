<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cámara · VideoRepo</title>
<link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#0e1116"><link rel="icon" href="/icon.svg" type="image/svg+xml">
<style>[hidden]{display:none!important}body{font:1rem system-ui;background:#0e1116;color:#eee;max-width:54rem;margin:auto;padding:1.2rem}@media (max-width:600px){body{padding:.6rem}.pad{grid-template-columns:repeat(3,min(22vw,4.2rem))!important}.pad button{height:min(22vw,4.2rem)!important;font-size:1.6rem!important}.zoom button{width:min(22vw,4.2rem)!important}h1{margin:.4rem 0}}a,button.link{color:#8ac6ff}img,video,iframe{display:block;width:100%;max-width:640px;aspect-ratio:16/9;border:0;background:#161b22}li{margin:.6rem 0}.pad{display:grid;grid-template-columns:repeat(3,3.2rem);gap:.4rem;margin:.8rem 0}.pad button{height:3.2rem;font-size:1.3rem;border:1px solid #30363d;border-radius:.6rem;background:#161b22;color:#eee;cursor:pointer;touch-action:none;user-select:none}.pad button:active,.pad button.on{background:#1f6feb}.pad button:focus-visible{outline:2px solid #8ac6ff}.zoom{display:flex;gap:.4rem}.zoom button{width:3.2rem}button.link{background:none;border:0;padding:0;font:inherit;cursor:pointer;text-decoration:underline}</style>
<a href="/">← VideoRepo</a><h1>Cámara</h1>
<!-- Por HTTP en la LAN: WebRTC directo a go2rtc (:1984). Por HTTPS (tailnet, la app del celular): go2rtc en el mismo
     origen bajo /go2rtc (tailscale serve) y por MSE, que viaja por el WebSocket HTTPS y anda en casa o afuera;
     un iframe http dentro de una página https lo bloquearía el navegador por contenido mixto. -->
<iframe id="live" title="Cámara de la entrada en vivo" allow="autoplay; fullscreen" allowfullscreen></iframe>
<img id="photo" alt="Imagen actual de la cámara" hidden>
<div class="pad" role="group" aria-label="Mover la cámara (mantené apretado; flechas del teclado)">
  <span></span><button type="button" data-dir="up" aria-label="Arriba">▲</button><span></span>
  <button type="button" data-dir="left" aria-label="Izquierda">◀</button><button type="button" data-stop aria-label="Detener">■</button><button type="button" data-dir="right" aria-label="Derecha">▶</button>
  <span></span><button type="button" data-dir="down" aria-label="Abajo">▼</button><span></span>
</div>
<div class="zoom pad" role="group" aria-label="Zoom"><button type="button" data-dir="zoom_in" aria-label="Acercar">＋</button><button type="button" data-dir="zoom_out" aria-label="Alejar">－</button></div>
<p id="state" role="status">En vivo. <button class="link" id="toggle" type="button">Ver foto en vez de video</button></p>
<h2>Grabaciones por movimiento</h2><ul id="clips"></ul>
<script>
const live=document.querySelector('#live'), photo=document.querySelector('#photo'), state=document.querySelector('#state'), toggle=document.querySelector('#toggle'), clips=document.querySelector('#clips');
live.src=location.protocol==='https:'?'/go2rtc/stream.html?src=entrada&mode=mse':'http://'+location.hostname+':1984/stream.html?src=entrada&mode=webrtc';
let photoMode=false, timer=null;
function refresh(){if(photoMode&&!document.hidden)photo.src='/camara/imagen?t='+Date.now()}
photo.onload=()=>{if(!photoMode)return;state.firstChild.textContent='Foto de las '+new Date().toLocaleTimeString()+'. ';timer=setTimeout(refresh,1000)};
photo.onerror=()=>{if(!photoMode)return;state.firstChild.textContent='Cámara sin señal. Reintentando… ';timer=setTimeout(refresh,5000)};
toggle.onclick=()=>{
  photoMode=!photoMode;clearTimeout(timer);
  live.hidden=photoMode;photo.hidden=!photoMode;
  toggle.textContent=photoMode?'Volver al video en vivo':'Ver foto en vez de video';
  state.firstChild.textContent=photoMode?'Cargando foto… ':'En vivo. ';
  if(photoMode)refresh();
};
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});
async function list(){try{
  const r=await fetch('/api/videos',{cache:'no-store'});if(!r.ok)throw Error();
  const files=(await r.json()).filter(v=>v.name.startsWith('CamNet_record_')).sort((a,b)=>b.name.localeCompare(a.name));
  clips.replaceChildren(...files.map(v=>{const li=document.createElement('li'),a=document.createElement('a');a.href='/videos/'+encodeURIComponent(v.name);a.textContent=v.name.replace('CamNet_record_','');li.append(a);return li}));
  if(!files.length)clips.textContent='Todavía no hay clips.';
}catch{clips.textContent='No se pudo cargar la lista.'}}
list();setInterval(list,30000);
// Pad PTZ: mientras se mantiene apretado se repite la orden (cada una frena sola a los 1,5 s en el grabador);
// al soltar, salir del botón o cancelar el toque se manda stop.
const ptzSend=(path,body)=>fetch(path,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams(body)}).catch(()=>{});
let held=null, repeat=null;
function ptzStart(btn){ptzEnd();held=btn;btn.classList.add('on');const go=()=>ptzSend('/camara/ptz/move',{direction:btn.dataset.dir,speed:'0.6',seconds:'1.5'});go();repeat=setInterval(go,1000)}
function ptzEnd(){if(!held)return;clearInterval(repeat);repeat=null;held.classList.remove('on');held=null;ptzSend('/camara/ptz/stop',{})}
document.querySelectorAll('[data-dir]').forEach(b=>{
  b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);ptzStart(b)});
  for(const ev of ['pointerup','pointerleave','pointercancel'])b.addEventListener(ev,ptzEnd);
  b.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();ptzSend('/camara/ptz/move',{direction:b.dataset.dir,speed:'0.6',seconds:'0.6'})}});
});
document.querySelector('[data-stop]').addEventListener('click',()=>{ptzEnd();ptzSend('/camara/ptz/stop',{})});
const keys={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right','+':'zoom_in','-':'zoom_out'};
document.addEventListener('keydown',e=>{const d=keys[e.key];if(!d||e.target.closest('[data-dir]'))return;e.preventDefault();ptzSend('/camara/ptz/move',{direction:d,speed:'0.6',seconds:'0.6'})});
window.addEventListener('blur',ptzEnd);

</script></html>
